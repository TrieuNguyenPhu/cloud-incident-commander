[project]
name = "cic-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cic-contracts",
  "fastapi==0.143.2",
  "mangum==0.22.0",
  "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
cic-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cic_api"]
